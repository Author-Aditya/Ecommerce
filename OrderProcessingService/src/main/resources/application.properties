spring.application.name=OrderProcessingService

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=order

# Order Requests Queue and Exchange
spring.rabbitmq.queue.order.requests=order.requests
spring.rabbitmq.exchange.order.requests=order.requests.exchange
spring.rabbitmq.routing-key.order.requests=order.requests

# Order Status Queue and Exchange
spring.rabbitmq.queue.order.status=order.status.queue
spring.rabbitmq.exchange.order.status=order.status.exchange

# Dead Letter Queue and Exchange
spring.rabbitmq.queue.order.deadletter=order.deadletter
spring.rabbitmq.exchange.order.deadletter=order.deadletter.exchange
spring.rabbitmq.routing-key.order.deadletter=order.deadletter

# Server Port
server.port=8082

# RabbitMQ Listener Concurrency (Thread Pool Size)
spring.rabbitmq.listener.concurrency=3
