spring.application.name=OrderIntakeService

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=order

# Order Requests Queue and Exchange
spring.rabbitmq.queue.order.requests=order.requests
spring.rabbitmq.exchange.order.requests=order.requests.exchange
spring.rabbitmq.routing-key.order.requests=order.requests

# Dead Letter Queue and Exchange
spring.rabbitmq.queue.order.deadletter=order.deadletter
spring.rabbitmq.exchange.order.deadletter=order.deadletter.exchange
spring.rabbitmq.routing-key.order.deadletter=order.deadletter

# Server Port
server.port=8080

# Product Manager Service
product.manager.url=http://localhost:8081

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false
